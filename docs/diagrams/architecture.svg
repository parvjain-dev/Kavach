<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" font-family="Anek Latin, Anek Devanagari, system-ui, sans-serif"><defs><marker id="a1b2559" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1b2559"/></marker><marker id="ac42b1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c42b1c"/></marker><marker id="a17794d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17794d"/></marker><marker id="ab97800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b97800"/></marker><marker id="a4a5173" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5173"/></marker></defs><rect width="1600" height="820" fill="#f4f5f1"/><text x="40" y="52" font-size="30" font-weight="800" fill="#1b2559">Kavach architecture</text><text x="40" y="80" font-size="17" fill="#4a5173">Everything runs on Google Cloud and Firebase. One Cloud Run service serves the app and the API.</text><rect x="40" y="150" width="300" height="120" rx="14" fill="#fff" stroke="#1b2559" stroke-width="2.5"/><text x="190.0" y="206.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Parent phone</text><text x="190.0" y="230.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Paste / photo / voice note</text><text x="190.0" y="250.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">7 languages, read-aloud</text><rect x="40" y="520" width="300" height="120" rx="14" fill="#fff" stroke="#1b2559" stroke-width="2.5"/><text x="190.0" y="576.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Guardian dashboard</text><text x="190.0" y="600.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Live feed, one-tap actions</text><text x="190.0" y="620.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Scam Radar</text><rect x="420" y="150" width="260" height="120" rx="14" fill="#eef0fa" stroke="#1b2559" stroke-width="2.5"/><text x="550.0" y="206.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Firebase Hosting</text><text x="550.0" y="230.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Static app + rewrite</text><text x="550.0" y="250.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">to Cloud Run</text><rect x="760" y="120" width="420" height="330" rx="18" fill="#fff" stroke="#1b2559" stroke-width="3.5"/><text x="970" y="156" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Cloud Run  (Node / Express)</text><rect x="780" y="176" width="185" height="84" rx="10" fill="#eef0fa" stroke="#1b2559" stroke-width="2"/><text x="872.5" y="214.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">/api/analyze</text><text x="872.5" y="238.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">text, image, audio</text><rect x="975" y="176" width="185" height="84" rx="10" fill="#fdf1d6" stroke="#b97800" stroke-width="2"/><text x="1067.5" y="214.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Safety net</text><text x="1067.5" y="238.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">rule-based guardrails</text><rect x="780" y="282" width="185" height="84" rx="10" fill="#eef0fa" stroke="#1b2559" stroke-width="2"/><text x="872.5" y="320.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Verdict merge</text><text x="872.5" y="344.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Gemini + rules</text><rect x="975" y="282" width="185" height="84" rx="10" fill="#fbe9e6" stroke="#c42b1c" stroke-width="2"/><text x="1067.5" y="320.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Scam Radar</text><text x="1067.5" y="344.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">embedding match</text><text x="970" y="410" text-anchor="middle" font-size="15" fill="#4a5173">Admin SDK writes. Browsers only read.</text><rect x="1330" y="150" width="230" height="140" rx="14" fill="#e2f3ea" stroke="#17794d" stroke-width="2.5"/><text x="1445.0" y="216.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Gemini API</text><text x="1445.0" y="240.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Image, audio, text in</text><text x="1445.0" y="260.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">JSON verdict, explanation</text><text x="1445.0" y="280.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">in 7 languages, embeddings</text><rect x="1330" y="500" width="230" height="150" rx="14" fill="#fdf1d6" stroke="#b97800" stroke-width="2.5"/><text x="1445.0" y="571.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Firestore</text><text x="1445.0" y="595.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">families · reports</text><text x="1445.0" y="615.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">campaigns · radar_items</text><text x="1445.0" y="635.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">rules: guardian-only reads</text><rect x="420" y="520" width="260" height="120" rx="14" fill="#eef0fa" stroke="#1b2559" stroke-width="2.5"/><text x="550.0" y="576.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Firebase Auth</text><text x="550.0" y="600.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Google or guest</text><text x="550.0" y="620.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">guardian identity</text><line x1="340" y1="210" x2="420" y2="210" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><text x="380" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2559" paint-order="stroke" stroke="#f4f5f1" stroke-width="5">HTTPS</text><line x1="680" y1="210" x2="760" y2="210" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><line x1="1180" y1="205" x2="1330" y2="205" stroke="#17794d" stroke-width="2.6" marker-end="url(#a17794d)"/><text x="1255" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#17794d" paint-order="stroke" stroke="#f4f5f1" stroke-width="5">prompt + media</text><line x1="1330" y1="255" x2="1180" y2="255" stroke="#17794d" stroke-width="2.6" marker-end="url(#a17794d)"/><text x="1255" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#17794d" paint-order="stroke" stroke="#f4f5f1" stroke-width="5">JSON verdict</text><line x1="1180" y1="400" x2="1330" y2="520" stroke="#b97800" stroke-width="2.6" marker-end="url(#ab97800)"/><text x="1272" y="470" text-anchor="end" font-size="15" font-weight="700" fill="#b97800" paint-order="stroke" stroke="#f4f5f1" stroke-width="5">write report + campaign</text><line x1="340" y1="580" x2="420" y2="580" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><text x="380" y="568" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2559" paint-order="stroke" stroke="#f4f5f1" stroke-width="5">sign in</text><line x1="790" y1="452" x2="640" y2="520" stroke="#4a5173" stroke-width="2.6" marker-end="url(#a4a5173)"/><text x="700" y="500" text-anchor="end" font-size="15" font-weight="700" fill="#4a5173" paint-order="stroke" stroke="#f4f5f1" stroke-width="5">verify ID token</text><polyline points="1445,650 1445,730 190,730 190,650" fill="none" stroke="#b97800" stroke-width="2.6" marker-end="url(#ab97800)"/><text x="820" y="718" text-anchor="middle" font-size="15" font-weight="700" fill="#b97800">live updates: Firestore onSnapshot listeners</text><line x1="190" y1="270" x2="190" y2="520" stroke="#4a5173" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#a4a5173)"/><text x="204" y="400" font-size="15" font-weight="700" fill="#4a5173">verdict back to the parent,</text><text x="204" y="420" font-size="15" font-weight="700" fill="#4a5173">alert to the guardian</text><rect x="40" y="776" width="14" height="14" fill="#17794d"/><text x="62" y="789" font-size="15" fill="#1b2559">Gemini</text><rect x="150" y="776" width="14" height="14" fill="#b97800"/><text x="172" y="789" font-size="15" fill="#1b2559">Firestore data and live sync</text><rect x="390" y="776" width="14" height="14" fill="#c42b1c"/><text x="412" y="789" font-size="15" fill="#1b2559">Community early warning</text></svg>