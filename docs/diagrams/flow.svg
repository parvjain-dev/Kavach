<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Anek Latin, Anek Devanagari, system-ui, sans-serif"><defs><marker id="a1b2559" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1b2559"/></marker><marker id="ac42b1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c42b1c"/></marker><marker id="a17794d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17794d"/></marker><marker id="ab97800" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b97800"/></marker><marker id="a4a5173" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5173"/></marker></defs><rect width="1600" height="760" fill="#f4f5f1"/><text x="40" y="52" font-size="30" font-weight="800" fill="#1b2559">What happens when a parent checks a message</text><rect x="40" y="130" width="260" height="130" rx="14" fill="#fff" stroke="#1b2559" stroke-width="2.5"/><text x="170.0" y="191.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">1  Parent shares</text><text x="170.0" y="215.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Text, screenshot or</text><text x="170.0" y="235.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">voice note (WAV 16 kHz)</text><rect x="330" y="130" width="260" height="130" rx="14" fill="#e2f3ea" stroke="#17794d" stroke-width="2.5"/><text x="460.0" y="191.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">2  Gemini reads it</text><text x="460.0" y="215.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Transcribes / OCRs, names</text><text x="460.0" y="235.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">the scam type and tactics</text><rect x="620" y="130" width="260" height="130" rx="14" fill="#fdf1d6" stroke="#b97800" stroke-width="2.5"/><text x="750.0" y="191.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">3  Safety net</text><text x="750.0" y="215.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Rules can raise a verdict</text><text x="750.0" y="235.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">but never lower it</text><rect x="910" y="130" width="260" height="130" rx="14" fill="#fbe9e6" stroke="#c42b1c" stroke-width="2.5"/><text x="1040.0" y="191.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">4  Radar match</text><text x="1040.0" y="215.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Embedding vs last 24 h</text><text x="1040.0" y="235.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">joins or starts a campaign</text><rect x="1200" y="130" width="260" height="130" rx="14" fill="#eef0fa" stroke="#1b2559" stroke-width="2.5"/><text x="1330.0" y="191.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">5  Everyone told</text><text x="1330.0" y="215.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Parent sees the stamp.</text><text x="1330.0" y="235.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Guardian dashboard updates</text><line x1="300" y1="195" x2="330" y2="195" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><line x1="590" y1="195" x2="620" y2="195" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><line x1="880" y1="195" x2="910" y2="195" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><line x1="1170" y1="195" x2="1200" y2="195" stroke="#1b2559" stroke-width="2.6" marker-end="url(#a1b2559)"/><rect x="40" y="360" width="430" height="150" rx="14" fill="#fff" stroke="#1b2559" stroke-width="2.5"/><text x="255.0" y="431.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Parent gets (own language)</text><text x="255.0" y="455.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Stamp: SCAM / CAREFUL / LOOKS SAFE</text><text x="255.0" y="475.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Highlighted tricks in the message</text><text x="255.0" y="495.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">What to do · what not to do · read-aloud</text><line x1="1330" y1="260" x2="330" y2="360" stroke="#4a5173" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#a4a5173)"/><line x1="1330" y1="260" x2="1330" y2="360" stroke="#4a5173" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#a4a5173)"/><rect x="980" y="360" width="580" height="150" rx="14" fill="#fff" stroke="#1b2559" stroke-width="2.5"/><text x="1270.0" y="431.0" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2559">Guardian dashboard (live, Firestore listeners)</text><text x="1270.0" y="455.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">English summary · tactic chips</text><text x="1270.0" y="475.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Call Papa · Mark handled · Block sender</text><text x="1270.0" y="495.0" text-anchor="middle" font-size="15.5" fill="#4a5173" font-weight="500">Radar: &quot;14 similar reports in the last hour&quot;</text><rect x="40" y="580" width="1520" height="130" rx="14" fill="#fff" stroke="#c9cfe0" stroke-width="2"/><text x="64" y="618" font-size="20" font-weight="800" fill="#1b2559">Built so a demo never breaks</text><text x="64" y="652" font-size="16.5" fill="#4a5173">Model chain tries gemini-3.8-flash, then older Flash models if one is unavailable. If Gemini is down, the rule engine still answers.</text><text x="64" y="680" font-size="16.5" fill="#4a5173">Identical inputs are cached. Radar falls back to a local embedder. Prompt-injection text inside a message is treated as a scam signal.</text></svg>